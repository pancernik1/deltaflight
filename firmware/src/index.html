<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
           font-src 'self' https://fonts.gstatic.com;
           script-src 'self' 'unsafe-inline';
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           connect-src 'self' http://localhost:5050;
           img-src 'self' data: blob:;">>
<title>ΔF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0a0a0c;
    --surface: #111115;
    --border:  #2a2a35;
    --accent:  #c8f53a;
    --text:    #d4d4e0;
    --muted:   #5a5a70;
    --mono:    'Share Tech Mono', monospace;
    --sans:    'Barlow', sans-serif;
    --cond:    'Barlow Condensed', sans-serif;
    --titlebar-h: 38px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 1000;
  }

  /* ── CUSTOM TITLEBAR ── */
  #titlebar {
    height: var(--titlebar-h);
    background: #07070a;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    -webkit-app-region: drag;   /* makes it draggable */
    flex-shrink: 0;
    user-select: none;
    gap: 0.6rem;
  }
  #titlebar .tb-logo {
    font-family: var(--cond);
    font-weight: 900;
    font-style: italic;
    font-size: 1rem;
    color: #fff;
    letter-spacing: 0.05em;
  }
  #titlebar .tb-logo span { color: var(--accent); }
  #titlebar .tb-title {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-left: 0.5rem;
  }
  #win-controls {
    margin-left: auto;
    display: flex;
    gap: 0.35rem;
    -webkit-app-region: no-drag;  /* buttons must not drag */
  }
  .wc-btn {
    all: unset;
    width: 13px; height: 13px;
    border-radius: 50%;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .wc-btn:hover { filter: brightness(1.3); }
  #wc-close    { background: #f53a5a; }
  #wc-minimize { background: #f5c83a; }
  #wc-maximize { background: #c8f53a; }

  /* ── APP SHELL (below titlebar) ── */
  #app-shell {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .logo {
    font-family: var(--cond);
    font-weight: 900;
    font-size: 1.5rem;
    color: #fff;
    font-style: italic;
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--accent); }
  .clock { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── MAIN LAYOUT ── */
  #main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 200px;
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--surface);
    flex-shrink: 0;
    overflow-y: auto;
  }
  .tab-btn {
    all: unset;
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
    border-left: 2px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .tab-btn.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(200,245,58,0.05);
    font-weight: 600;
  }
  .tab-btn .icon { width: 16px; text-align: center; flex-shrink: 0; }

  /* ── CONTENT ── */
  .content { flex: 1; padding: 2rem 2.5rem; overflow-y: auto; }

  .tab-panel { display: none; animation: fadeUp 0.18s ease; height: 100%; }
  .tab-panel.active { display: block; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

  .panel-title {
    font-family: var(--cond); font-weight: 900; font-size: 1.8rem;
    text-transform: uppercase; letter-spacing: 0.05em; color: #fff;
    margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
  }
  .placeholder {
    border: 1px dashed var(--border); border-radius: 4px;
    padding: 4rem 2rem; text-align: center;
    color: var(--muted); font-family: var(--mono);
    font-size: 0.75rem; letter-spacing: 0.08em;
  }
  .placeholder-icon { font-size: 1.8rem; margin-bottom: 0.75rem; opacity: 0.25; }

  /* ── DEBUG TERMINAL ── */
  #dt-wrap {
    display: flex; flex-direction: column;
    height: calc(100vh - var(--titlebar-h) - 56px - 4rem);
    min-height: 300px;
    background: #08080b;
    border: 1px solid #2a2a35;
    border-radius: 4px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 0.78rem;
  }
  #dt-toolbar {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.45rem 0.85rem;
    background: #111115; border-bottom: 1px solid #2a2a35;
    flex-shrink: 0;
  }
  .dt-tb-dot { width:10px; height:10px; border-radius:50%; }
  #dt-status-label {
    margin-left: auto; font-size: 0.6rem;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  #dt-status-label.online  { color: #c8f53a; }
  #dt-status-label.offline { color: #f53a5a; }
  #dt-output {
    flex: 1; overflow-y: auto;
    padding: 0.85rem 1rem; line-height: 1.75; color: #9090aa;
  }
  #dt-output::-webkit-scrollbar { width: 3px; }
  #dt-output::-webkit-scrollbar-thumb { background: #2a2a35; }
  .dt-line { display: flex; gap: 0.5rem; }
  .dt-line-prompt { color: #c8f53a; flex-shrink: 0; }
  .dt-line-cmd    { color: #d4d4e0; }
  .dt-line-res    { color: #9090aa; padding-left: 1.1rem; }
  .dt-line-err    { color: #f53a5a; padding-left: 1.1rem; }
  .dt-line-sys    { color: #3af5c8; font-style: italic; }
  #dt-input-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-top: 1px solid #2a2a35;
    background: #0d0d10; flex-shrink: 0;
  }
  #dt-prompt-sym { color: #c8f53a; flex-shrink: 0; user-select: none; }
  #dt-input {
    all: unset; flex: 1;
    color: #d4d4e0; caret-color: #c8f53a;
    font-family: var(--mono); font-size: 0.78rem;
  }
  #dt-input::placeholder { color: #3a3a50; }
  .dt-spinner {
    display: inline-block; width: 8px; height: 8px;
    border: 1px solid #3a3a50; border-top-color: #c8f53a;
    border-radius: 50%;
    animation: dt-spin 0.6s linear infinite; margin-left: 0.4rem;
  }
  @keyframes dt-spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Custom frameless titlebar -->
<div id="titlebar">
  <div class="tb-logo"><span>Δ</span>FLIGHT</div>
  <span class="tb-title" id="version-text">V-X-X-X</span>
  <div id="win-controls">
    <button class="wc-btn" id="wc-close"    title="Close"></button>
    <button class="wc-btn" id="wc-minimize" title="Minimize"></button>
    <button class="wc-btn" id="wc-maximize" title="Maximize"></button>
  </div>
</div>

<div id="app-shell">
  <!-- Header -->
  <div style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
    <header>
      <div class="logo"><span>Δ</span>FLIGHT</div>
      <div class="clock"><span class="dot"></span><span id="clock">--:--:--</span></div>
    </header>

    <div id="main-layout">
      <!-- Sidebar -->
      <nav class="sidebar">
        <button class="tab-btn active" data-tab="map">    <span class="icon">◈</span> Map</button>
        <button class="tab-btn"        data-tab="data">   <span class="icon">▦</span> Data</button>
        <button class="tab-btn"        data-tab="devices"><span class="icon">⬡</span> Devices</button>
        <button class="tab-btn"        data-tab="debug">  <span class="icon">≡</span> Debug</button>
      </nav>

      <!-- Content -->
      <main class="content">

        <section class="tab-panel active" id="tab-map">
           <div class="panel-title">Map</div>
    <img id="map-img" style="max-width:100%; display:none; border-radius:4px;" />
    <div id="map-placeholder" class="placeholder">
      <div class="placeholder-icon">◈</div>
      No map loaded — use convert command in Debug tab
  </div>
        </section>

        <section class="tab-panel" id="tab-data">
          <div class="panel-title">Data</div>
          <div class="placeholder"><div class="placeholder-icon">▦</div>Data content goes here</div>
        </section>

        <section class="tab-panel" id="tab-devices">
          <div class="panel-title">Devices</div>
          <div class="placeholder"><div class="placeholder-icon">⬡</div>Devices content goes here</div>
        </section>

        <section class="tab-panel" id="tab-debug">
          <div class="panel-title">Debug</div>
          <div id="dt-wrap">
            <div id="dt-toolbar">
              <div class="dt-tb-dot" style="background:#f53a5a"></div>
              <div class="dt-tb-dot" style="background:#f5c83a"></div>
              <div class="dt-tb-dot" style="background:#c8f53a"></div>
              <span id="dt-status-label" class="offline">PARSER OFFLINE</span>
            </div>
            <div id="dt-output"></div>
            <div id="dt-input-row">
              <span id="dt-prompt-sym">&gt;_</span>
              <input id="dt-input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false"/>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>
</div>

<script>
  // ── Tab switching ──────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'debug') setTimeout(() => document.getElementById('dt-input')?.focus(), 50);
    });
  });

  // ── Version ────────────────────────────────────────────────────────────
async function fetchVersion() {
  while (true) {
    try {
      const r = await fetch("http://localhost:5050/cmd", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: "version" }),
        signal: AbortSignal.timeout(1000)
      });
      const d = await r.json();
      document.getElementById("version-text").textContent = d.output;
      return;
    } catch {
      await new Promise(r => setTimeout(r, 1000)); // wait 1s and retry
    }
  }
}
fetchVersion();
async function fetchMap() {
  try {
    const r = await fetch("http://localhost:5050/map");
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const img = document.getElementById("map-img");
    img.src = url;
    img.style.display = "block";
    document.getElementById("map-placeholder").style.display = "none";
  } catch {}
}
fetchMap();
  // ── Clock ──────────────────────────────────────────────────────────────
  function tick() { document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8); }
  tick(); setInterval(tick, 1000);

  // ── Window controls ────────────────────────────────────────────────────
  document.getElementById('wc-close')   ?.addEventListener('click', () => window.electronAPI.close());
  document.getElementById('wc-minimize')?.addEventListener('click', () => window.electronAPI.minimize());
  document.getElementById('wc-maximize')?.addEventListener('click', () => window.electronAPI.maximize());

  // ── Debug terminal ─────────────────────────────────────────────────────
  const PARSER_URL = "http://localhost:5050/cmd";
  const history = [];
  let histIdx = -1;

  function out() { return document.getElementById("dt-output"); }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function printLine(html) {
    const d = document.createElement("div");
    d.className = "dt-line";
    d.innerHTML = html;
    out().appendChild(d);
    out().scrollTop = out().scrollHeight;
  }

  function printSys(msg)       { printLine(`<span class="dt-line-sys">${escHtml(msg)}</span>`); }
  function printCmd(cmd)       { printLine(`<span class="dt-line-prompt">&gt;_</span><span class="dt-line-cmd">${escHtml(cmd)}</span>`); }
  function printRes(t, isErr)  {
    if (!t) return;
    t.split("\n").forEach(l => printLine(`<span class="${isErr?"dt-line-err":"dt-line-res"}">${escHtml(l)}</span>`));
  }

  function setStatus(online) {
    const el = document.getElementById("dt-status-label");
    if (!el) return;
    el.textContent = online ? "PARSER ONLINE" : "PARSER OFFLINE";
    el.className   = online ? "online" : "offline";
  }

  async function sendCmd(cmd) {
    if (!cmd.trim()) return;
    history.unshift(cmd); histIdx = -1;
    printCmd(cmd);
    if (cmd.trim().toLowerCase() === "clear") { out().innerHTML = ""; return; }

    const spin = document.createElement("div");
    spin.className = "dt-line";
    spin.innerHTML = `<span class="dt-line-res">waiting<span class="dt-spinner"></span></span>`;
    out().appendChild(spin);
    out().scrollTop = out().scrollHeight;

    try {
      const resp = await fetch(PARSER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd }),
      });
      spin.remove(); setStatus(true);
      if (!resp.ok) { printRes(`HTTP ${resp.status}`, true); return; }
      const data = await resp.json();
      const o = data.output ?? "";
      if (o === "__CLEAR__") { out().innerHTML = ""; return; }
      printRes(o, false);
      if (cmd.trim().toLowerCase().startsWith("convert")) fetchMap();
    } catch {
      spin.remove(); setStatus(false);
      printRes(`Connection failed — is DebugParser running on port 5050?`, true);
    }
  }

  async function checkConn() {
    try {
      await fetch(PARSER_URL, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({command:"ping"}), signal: AbortSignal.timeout(1500) });
      setStatus(true);
    } catch { setStatus(false); }
  }

  // Wire input
  const dtInput = document.getElementById("dt-input");
  dtInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter")     { const v = dtInput.value; dtInput.value = ""; sendCmd(v); }
    if (e.key === "ArrowUp")   { e.preventDefault(); histIdx = Math.min(histIdx+1, history.length-1); dtInput.value = history[histIdx]??""; }
    if (e.key === "ArrowDown") { e.preventDefault(); histIdx = Math.max(histIdx-1, -1); dtInput.value = histIdx===-1?"":history[histIdx]??""; }
  });

  // Init terminal
  printSys("ΔF Debug Terminal v1.0");
  printSys("Type 'help' for available commands.");
  printLine("");
  checkConn();
  setInterval(checkConn, 5000);
</script>
</body>
</html>
